# Hugo configuration file
title: Our Grey World

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Game Documentation
      pageRef: /docs
      weight: 2
    - name: About
      pageRef: /about
      weight: 1
    - name: Contact ↗
      url: "https://koiyocreate.com"
      weight: 3
    - name: STL & 3D Files ↗
      weight: 4
      url: "https://github.com/Nokoiyo/ourgreyworld-assets"
    - name: Patreon ↗
      weight: 5
      url: "https://github.com/Nokoiyo/ourgreyworld-assets"
    - name: Search
      weight: 6
      params:
        type: search
    - name: Twitter
      weight: 7
      url: "https://twitter.com/"
      params:
        icon: x-twitter
    

params:
  theme:
    default: system
    displayToggle: true

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
