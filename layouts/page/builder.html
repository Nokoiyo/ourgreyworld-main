<!-- Configure Tailwind to respect Blowfish's Light/Dark mode toggles -->
<script>
  tailwind = {
    darkMode: 'class',
    corePlugins: { preflight: false }
  }
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<!-- DYNAMIC HUGO DATA BRIDGE -->
<!-- This pulls EVERYTHING inside data/factions/ dynamically -->
<script>
  window.FACTIONS_DATA = {{ site.Data.factions | default dict | jsonify | safeJS }};
</script>

<!-- Main App Wrapper (Translucent Glassmorphism for Light/Dark Themes) -->
<div x-data="armyBuilder(window.FACTIONS_DATA)" class="w-full max-w-6xl mx-auto my-8 font-sans text-neutral-900 dark:text-neutral-100 flex flex-col gap-6">
  
  <!-- Header / Toolbar -->
  <header class="flex flex-col md:flex-row justify-between items-center gap-4 p-4 rounded-2xl border border-neutral-300 dark:border-neutral-800 bg-white/60 dark:bg-neutral-950/60 backdrop-blur-xl shadow-sm">
    
    <div class="flex items-center gap-4 w-full md:w-auto">
      <div class="flex flex-col">
        <h1 class="text-lg font-bold tracking-tight uppercase leading-none">Roster Builder</h1>
        <span class="text-[10px] uppercase tracking-widest text-neutral-500 font-semibold">OGW | Harrowing</span>
      </div>
      
      <div class="w-px h-8 bg-neutral-300 dark:bg-neutral-800 mx-2 hidden md:block"></div>

      <!-- Dynamic Faction Selector -->
      <div class="flex-1 md:flex-none flex items-center bg-white dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700 rounded-lg px-2 py-1">
        <label class="text-[10px] font-bold uppercase tracking-widest text-neutral-400 mr-2">Faction</label>
        <select x-model="selectedFactionId" @change="loadFaction()" class="bg-transparent text-sm font-semibold text-neutral-800 dark:text-neutral-200 focus:outline-none cursor-pointer w-full">
          <template x-for="(faction, id) in factions" :key="id">
            <option :value="id" x-text="faction.faction_name || id" class="bg-white dark:bg-neutral-900"></option>
          </template>
          <option x-show="!hasData" value="">No Data Found</option>
        </select>
      </div>
    </div>

    <!-- Export & Points -->
    <div class="flex items-center gap-4">
      <div class="text-right">
        <span class="text-[10px] font-bold uppercase tracking-widest text-neutral-500 block leading-none">Total Points</span>
        <div class="text-2xl font-bold font-mono tracking-tighter leading-none mt-1" :class="calculateTotalPoints() > pointLimit ? 'text-red-500' : 'text-neutral-800 dark:text-neutral-100'">
          <span x-text="calculateTotalPoints()"></span>
          <span class="text-sm text-neutral-400">/<span x-text="pointLimit"></span></span>
        </div>
      </div>
      
      <div class="w-px h-8 bg-neutral-300 dark:bg-neutral-800 mx-1"></div>
      
      <button @click="shareList()" class="px-3 py-1.5 text-xs font-semibold rounded-md border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors">
        Share URL
      </button>
      <button @click="window.print()" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 hover:opacity-80 transition-opacity">
        Print Sheet
      </button>
    </div>
  </header>

  <!-- Workspace Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- LEFT PANEL: Unit Catalog -->
    <div class="lg:col-span-5 flex flex-col gap-3">
      <h2 class="text-[11px] font-bold uppercase tracking-widest text-neutral-500 px-1">Available Units</h2>
      
      <!-- List of Units -->
      <div class="flex flex-col gap-2 max-h-[70vh] overflow-y-auto pr-2 custom-scrollbar">
        
        <template x-for="unit in (currentFaction.units || [])" :key="unit.id">
          <div class="group flex items-center justify-between p-3 rounded-xl border border-neutral-300 dark:border-neutral-800 bg-white/60 dark:bg-neutral-950/60 backdrop-blur-md hover:border-neutral-400 dark:hover:border-neutral-600 transition-colors">
            
            <div>
              <h3 class="font-bold text-sm leading-tight" x-text="unit.name"></h3>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-[10px] uppercase tracking-wider text-neutral-500 font-semibold" x-text="unit.category"></span>
                <span class="w-1 h-1 rounded-full bg-neutral-300 dark:bg-neutral-700"></span>
                <span class="text-xs font-mono font-medium text-neutral-600 dark:text-neutral-400" x-text="`${unit.base_points} pts`"></span>
              </div>
            </div>

            <button @click="addUnit(unit)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-neutral-100 dark:bg-neutral-900 text-neutral-500 hover:bg-neutral-200 dark:hover:bg-neutral-800 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
            
          </div>
        </template>

        <!-- Dynamic Error State if Factions fold is empty -->
        <div x-show="!hasData" class="p-6 text-center border border-neutral-300 dark:border-neutral-800 rounded-xl bg-white/40 dark:bg-neutral-950/40">
          <p class="text-sm font-semibold">No factions loaded.</p>
          <p class="text-xs text-neutral-500 mt-2">Create a file at <code>data/factions/any_name.yaml</code> and restart your Hugo server.</p>
        </div>

      </div>
    </div>

    <!-- RIGHT PANEL: Active Roster -->
    <div class="lg:col-span-7 flex flex-col gap-3">
      <h2 class="text-[11px] font-bold uppercase tracking-widest text-neutral-500 px-1">Active Roster</h2>
      
      <div class="flex flex-col gap-3 max-h-[70vh] overflow-y-auto pr-2 custom-scrollbar">
        
        <template x-for="(entry, index) in activeRoster" :key="index">
          <div class="relative p-4 rounded-xl border border-neutral-300 dark:border-neutral-800 bg-white/80 dark:bg-neutral-900/80 backdrop-blur-xl shadow-sm">
            
            <div class="flex justify-between items-start mb-2">
              <div>
                <h3 class="font-bold text-base" x-text="entry.name"></h3>
                <div class="text-xs text-neutral-500 font-mono mt-0.5">Base: <span x-text="`${entry.base_points} pts`"></span></div>
              </div>
              
              <button @click="removeUnit(index)" class="text-neutral-400 hover:text-red-500 transition-colors p-1" title="Remove Unit">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>

            <!-- Upgrades & Options Checkboxes -->
            <div x-show="entry.options && entry.options.length > 0" class="mt-3 pt-3 border-t border-neutral-200 dark:border-neutral-800">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <template x-for="opt in entry.options" :key="opt.name">
                  <label class="flex items-start gap-3 p-2 rounded-md hover:bg-neutral-100 dark:hover:bg-neutral-800/50 cursor-pointer transition-colors border border-transparent">
                    <input type="checkbox" :value="JSON.stringify(opt)" x-model="entry.selectedOptionsRaw" @change="updateOptions(index)" class="mt-0.5 w-3.5 h-3.5 rounded-sm border-neutral-300 dark:border-neutral-600 bg-white dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100 focus:ring-0">
                    <div class="flex flex-col">
                      <span class="text-xs font-semibold leading-tight" x-text="opt.name"></span>
                      <span class="text-[10px] font-mono text-neutral-500" x-text="`+${opt.points} pts`"></span>
                    </div>
                  </label>
                </template>
              </div>
            </div>

          </div>
        </template>
        
        <div x-show="activeRoster.length === 0" class="flex flex-col items-center justify-center h-40 border border-dashed border-neutral-300 dark:border-neutral-700 rounded-xl text-neutral-400">
          <p class="text-xs font-bold uppercase tracking-widest">Roster is Empty</p>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
function armyBuilder(factionsData) {
  return {
    // This dynamically reads the data injected by Hugo
    factions: factionsData || {},
    selectedFactionId: '',
    currentFaction: { units: [] }, 
    activeRoster: [],
    pointLimit: 1000,
    hasData: false,

    init() {
      // 1. Check if Hugo successfully passed any YAML files
      const keys = Object.keys(this.factions);
      if (keys.length > 0) {
        this.hasData = true;
        // Dynamically select the first file Hugo finds
        this.selectedFactionId = keys[0];
        this.loadFaction();
      }
      this.loadFromURL();
    },

    loadFaction() {
      // Load whatever faction was selected from the dropdown
      this.currentFaction = this.factions[this.selectedFactionId] || { units: [] };
      if (this.currentFaction.point_limit_default) {
        this.pointLimit = this.currentFaction.point_limit_default;
      }
    },

    addUnit(unit) {
      const newUnit = JSON.parse(JSON.stringify(unit));
      this.activeRoster.push({
        ...newUnit,
        selectedOptionsRaw: [], 
        selectedOptions: []     
      });
      this.saveToLocalStorage();
    },

    removeUnit(index) {
      this.activeRoster.splice(index, 1);
      this.saveToLocalStorage();
    },

    updateOptions(index) {
      const unit = this.activeRoster[index];
      unit.selectedOptions = unit.selectedOptionsRaw.map(optStr => JSON.parse(optStr));
      this.saveToLocalStorage();
    },

    calculateTotalPoints() {
      return this.activeRoster.reduce((sum, item) => {
        let optionsCost = (item.selectedOptions || []).reduce((optSum, opt) => optSum + opt.points, 0);
        return sum + item.base_points + optionsCost;
      }, 0);
    },

    saveToLocalStorage() {
      localStorage.setItem('ogw_roster', JSON.stringify(this.activeRoster));
    },

    shareList() {
      try {
        const encodedState = btoa(encodeURIComponent(JSON.stringify(this.activeRoster)));
        const shareUrl = `${window.location.origin}${window.location.pathname}?list=${encodedState}`;
        navigator.clipboard.writeText(shareUrl);
        alert('Share link copied to clipboard!');
      } catch (e) {
        console.error("Failed to generate link", e);
      }
    },

    loadFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const listParam = urlParams.get('list');
      if (listParam) {
        try {
          this.activeRoster = JSON.parse(decodeURIComponent(atob(listParam)));
        } catch (e) {
          console.error("URL Parsing Error", e);
        }
      } else {
        const saved = localStorage.getItem('ogw_roster');
        if (saved) {
           this.activeRoster = JSON.parse(saved);
        }
      }
    }
  }
}
</script>

<style>
/* Clean minimalist scrollbar to match the studio aesthetic */
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
</style>
